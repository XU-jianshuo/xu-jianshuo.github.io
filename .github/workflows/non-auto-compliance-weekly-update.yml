name: 非车合规库周度更新

on:
  schedule:
    # Every Monday at 09:00 Asia/Shanghai (01:00 UTC).
    - cron: '0 1 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'non-auto-compliance/automation/.run-weekly-update'

permissions:
  contents: write

concurrency:
  group: non-auto-compliance-weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r non-auto-compliance/automation/requirements.txt
      - name: Rebuild knowledge base
        working-directory: non-auto-compliance/automation
        run: python build_knowledge.py
      - name: Stage updated public page
        working-directory: non-auto-compliance/automation
        run: python -c "from pathlib import Path; import shutil; shutil.copy2(Path('个人非车险合规知识库.html'), Path('../index.html'))"
      - name: Review official updates
        working-directory: non-auto-compliance/automation
        run: python weekly_regulation_update.py
      - name: Commit updated library and review record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add non-auto-compliance/index.html non-auto-compliance/automation/制度索引.json non-auto-compliance/automation/output/weekly_updates
          git diff --cached --quiet || git commit -m 'chore: weekly non-auto compliance review'
          git push

